spring:
  application:
    name: rural-healthcare-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?currentSchema=public}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.qhsqnztonhrmqlkthzhb}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ruralhealthcare: INFO
    org.springframework.web: INFO
    org.flywaydb: INFO

ai:
  model:
    provider: ${AI_MODEL_PROVIDER:external}
    base-url: ${AI_MODEL_BASE_URL:https://parthgule-arogya-seva.hf.space}
    predict-path: ${AI_MODEL_PREDICT_PATH:/gradio_api/call/run_clinical_triage}
    api-key: ${AI_MODEL_API_KEY:${HF_TOKEN:}}
    version: ${AI_MODEL_VERSION:aarogya-clinical-engine-v2.0}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:45000}

security:
  jwt:
    enabled: ${JWT_AUTH_ENABLED:true}
    secret: ${JWT_SECRET:aarogya-seva-secret-key-rural-healthcare-jwt-token-2024-secure-key-32bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    strict-mode: ${JWT_STRICT_MODE:false}

internal:
  service-key: ${INTERNAL_SERVICE_KEY:internal-service-secret-key-rural-healthcare}


twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:your_twilio_account_sid}
    auth-token: ${TWILIO_AUTH_TOKEN:your_twilio_auth_token}
    phone-number: ${TWILIO_PHONE_NUMBER:+17856204033}
    webhook-base-url: ${CALLING_WEBHOOK_BASE_URL:https://tamper-daily-unfixable.ngrok-free.dev}
    mock-mode: ${TWILIO_MOCK_MODE:false}
ultravox:
    api-key: ${ULTRAVOX_API_KEY:your_ultravox_api_key}
    api-url: ${ULTRAVOX_API_URL:https://api.ultravox.ai/api}

