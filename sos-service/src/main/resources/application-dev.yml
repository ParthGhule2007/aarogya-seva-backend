server:
  port: 8082

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?currentSchema=sos}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.qhsqnztonhrmqlkthzhb}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

sos:
  notification:
    provider: ${SOS_NOTIFICATION_PROVIDER:fcm}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-admin.json}
    project-id: ${FIREBASE_PROJECT_ID:aarogya-seva-e8f23}
  clients:
    mode: mock

logging:
  level:
    com.ruralhealthcare.sos: DEBUG
    org.springframework.web: INFO
