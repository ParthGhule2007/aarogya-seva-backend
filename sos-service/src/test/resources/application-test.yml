spring:
  datasource:
    url: jdbc:h2:mem:sos_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

sos:
  nearby-radius-km: 5.0
  deduplication-window-minutes: 5
  notification:
    provider: mock
  clients:
    mode: mock

logging:
  level:
    com.ruralhealthcare.sos: DEBUG
