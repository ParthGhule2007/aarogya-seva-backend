server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:medicinedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS medicine
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false

medicine:
  missed-dose-threshold: 2
  reminder-grace-period-minutes: 60
  scheduler:
    enabled: false
  storage:
    provider: local
    local:
      directory: ./target/test-storage/medicine-images
  notification:
    provider: mock
    email-provider: mock
  ocr:
    provider: mock
  security:
    require-gateway-token: false
    require-authentication: false
